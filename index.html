<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OCR Struk 58mm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>OCR Struk 58mm</h2>

  <!-- Upload gambar -->
  <input type="file" id="fileInput" accept="image/*" />
  <button id="btnOCR">Jalankan OCR</button>
  <pre id="ocrRaw" style="white-space:pre-wrap"></pre>
  <hr />

  <!-- Form struk -->
  <form id="strukForm" onsubmit="return false;">
    <label>Header (Nama Toko)</label>
    <input id="header" value="AFFANDI CELL" />

    <label>No Tujuan</label>
    <input id="noTujuan" placeholder="0812xxxxxxx" />

    <label>Metode Tujuan (Bank/Ewallet)</label>
    <input id="metodeTujuan" placeholder="BCA / Dana" />

    <label>No Pengirim</label>
    <input id="noPengirim" placeholder="0881xxxxxxx" />

    <label>Metode Pengirim (Bank/Ewallet)</label>
    <input id="metodePengirim" placeholder="BRI / OVO" />

    <label>Nominal</label>
    <input id="nominal" type="number" value="0" />

    <label>Biaya Admin</label>
    <input id="admin" type="number" value="0" />

    <label>Footer</label>
    <input id="footer" value="Terima kasih 🙏" />

    <div style="margin-top:8px">
      <button id="btnPreview">Preview</button>
      <button id="btnPrint">Print Bluetooth</button>
    </div>
  </form>

  <pre id="preview" style="white-space:pre-wrap"></pre>

  <!-- Tesseract.js (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
